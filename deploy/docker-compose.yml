# mcl-sec-guard — how to run this service.
#
# Runnable as-is. It carries what the SERVICE knows about itself: its image, its
# port, the environment variables its own code reads, and its health check.
#
#   MCL_REALM=<64-hex> \
#     MCL_REALM_KEY=<hex of the realm's public signing key> \
#     MACULA_STATION_SEEDS=station.example:4433 \
#     MACULA_STATION_NODE_IDS=<64-hex node id of that station> \
#     docker compose -p mcl-sec-guard -f deploy/docker-compose.yml up -d
#
# IF YOU DEPLOY THROUGH SOMETHING ELSE, keep this file anyway and let the other
# thing carry PLACEMENT: which host, which station, which realm, which secret
# store. The split is worth holding to, because the alternative is a config table
# in a README and the real environment somewhere else, drifting apart with
# nothing checking them.

services:
  mcl-sec-guard:
    image: ghcr.io/macula-services/mcl-sec-guard:latest
    container_name: mcl-sec-guard
    restart: unless-stopped
    # HOST NETWORKING IS NOT LAZINESS. macula stations are reachable over IPv6
    # only, and a default docker bridge has no IPv6, so a bridged container
    # connects and then sits there with no healthy links, looking fine. If you
    # do want a bridge, give it IPv6 explicitly.
    network_mode: host
    volumes:
      # ⚠ THE SERVICE'S IDENTITY LIVES HERE. mcl_om generates the node key on
      # first boot and loads it on every boot after. The image declares this
      # path a VOLUME, and with nothing mounted docker gives each new container
      # a fresh anonymous one, so every recreate would mint a new node id while
      # the service looks healthy.
      - secrets:/etc/mcl/secrets
      # THE PROPOSAL LOG'S VOLUME, and it is why the path below can be a path.
      # The image declares no data volume of its own -- its Containerfile says
      # the scaffold writes nothing else yet -- but the recorder does write, one
      # line per denied window, and a log inside the container dies with it.
      - data:/var/lib/mcl-sec-guard
    labels:
      # Nothing reads this label: the fleet runs no watchtower.
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # No default. A service that guesses its realm announces itself where
      # nobody can attribute it, and that looks exactly like a healthy node.
      - MCL_REALM=${MCL_REALM:?set MCL_REALM to the 64-hex realm tag}
      # The TRUST ANCHOR, and a different thing from MCL_REALM above: that is
      # an identifier, this is the realm's public signing key, hex encoded.
      # Without it nothing org-namespaced resolves, the boot claim never
      # reaches the realm, and the container stays green while being
      # unreachable. Public material, so it belongs here and not in secrets.
      - MCL_REALM_KEY=${MCL_REALM_KEY:?set MCL_REALM_KEY to the hex-encoded public realm signing key}
      # No default either: naming a realm costs nothing, dialling somebody else's
      # live station from every dev clone does. The dial is PINNED:
      # every seed host pairs with its station's node id, index for index
      # (D5) -- mcl_om refuses to boot a pool with an unpinned seed, since
      # that dial could never connect anyway.
      - MACULA_STATION_SEEDS=${MACULA_STATION_SEEDS:?set MACULA_STATION_SEEDS to "host[:port][,host[:port]...]"}
      - MACULA_STATION_NODE_IDS=${MACULA_STATION_NODE_IDS:?set MACULA_STATION_NODE_IDS to the matching 64-hex node ids, comma-separated}
      - MCL_NODE_NAME=mcl_sec_guard
      - MCL_NODE_HOST=127.0.0.1
      - MCL_COOKIE=mcl_sec_guard
      # The alert topic the guardian subscribes to, and where the trainer's
      # run-set artifacts land (the console renders them). The run sets are a
      # DIRECTORY, and it belongs on the data volume above like the proposal log:
      # a directory under /app is the container's own filesystem and dies at the
      # next recreate, which for a run set the console is still serving is the
      # same silent loss (Terra, sg34 r1).
      - MCL_SEC_GUARD_ALERT_TOPIC=denials_observed
      - MCL_SEC_GUARD_TRAINER_RUNS=${MCL_SEC_GUARD_TRAINER_RUNS:-/var/lib/mcl-sec-guard/trainer_runs}
      # The admin console's port: 8458 is what mcl_sec_guard_admin:port/0 chooses
      # and what macula-fleet's edge/scripts/docker-compose.mcl-sec-guard.yml
      # sets. Named here rather than left to the release's own fallback, because
      # "the service knows its own port" is the point of this file.
      - MCL_SEC_GUARD_ADMIN_PORT=${MCL_SEC_GUARD_ADMIN_PORT:-8458}
      # Where proposals land, one line per window with denials. The path is ON
      # THE DATA VOLUME MOUNTED ABOVE: pointing it at /var/lib/... with nothing
      # mounted there would lose the log at every recreate while the container
      # looks healthy, which is worse than the missing port this file used to
      # have (mcl-sec-guard#34).
      - MCL_SEC_GUARD_PROPOSAL_LOG=${MCL_SEC_GUARD_PROPOSAL_LOG:-/var/lib/mcl-sec-guard/proposals.log}
      # Labels on the claim this service sends the realm at boot, which the
      # realm's operator sees on the pending row: what is asking, and from
      # which box. MCL_BOX comes from the host that deploys it.
      - MCL_SERVICE_NAME=mcl-sec-guard
      - MCL_BOX=${MCL_BOX:-}

# The identity volume, NAMED HERE rather than left to the project name, so a
# `docker compose -p` with a different name reuses the same key instead of
# quietly starting a second identity. Deleting it retires the node id.
volumes:
  secrets:
    name: mcl-sec-guard-secrets
  # Same reasoning: named here so a `docker compose -p' with another project
  # name keeps the proposal log rather than starting a second, empty one.
  data:
    name: mcl-sec-guard-data
