<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-label="mcl-sec-guard system context">
<title>mcl-sec-guard system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1100" height="780"/>
<rect class="b-per" x="60" y="30" width="280" height="120" rx="10"/>
<circle class="head" cx="86" cy="54" r="9"/>
<text class="t-name" x="104" y="58">Security reviewer</text>
<text class="t-type" x="104" y="76">[Person]</text>
<text class="t-desc" x="76" y="100">Reads the proposal log at /</text>
<text class="t-desc" x="76" y="116">and the trainer scoreboard;</text>
<text class="t-desc" x="76" y="132">decides nothing</text>
<rect class="b-ext" x="400" y="30" width="300" height="120" rx="10"/>
<text class="t-name" x="416" y="58">proposals.log and run sets</text>
<text class="t-type" x="416" y="76">[files it writes; compose mounts them]</text>
<text class="t-desc" x="416" y="100">MCL_SEC_GUARD_PROPOSAL_LOG</text>
<text class="t-desc" x="416" y="116">gets one ~0p line per proposal;</text>
<text class="t-desc" x="416" y="132">run sets land in trainer_runs/</text>
<rect class="b-per" x="770" y="30" width="270" height="104" rx="10"/>
<circle class="head" cx="796" cy="54" r="9"/>
<text class="t-name" x="814" y="58">Service operator</text>
<text class="t-type" x="814" y="76">[Person]</text>
<text class="t-desc" x="786" y="100">Deploys the release and sets</text>
<text class="t-desc" x="786" y="116">the environment it boots with</text>
<rect class="b-sys" x="400" y="220" width="300" height="150" rx="10"/>
<text class="t-name" x="416" y="248">mcl-sec-guard</text>
<text class="t-type" x="416" y="266">[mcl_om mesh service]</text>
<text class="t-desc" x="416" y="290">The guardian, P0 shadow: it</text>
<text class="t-desc" x="416" y="306">observes, proposes, records,</text>
<text class="t-desc" x="416" y="322">and applies nothing. Console</text>
<text class="t-desc" x="416" y="338">on the admin port, no auth</text>
<rect class="b-ext" x="60" y="460" width="280" height="140" rx="10"/>
<text class="t-name" x="76" y="488">Guarded services</text>
<text class="t-type" x="76" y="506">[External system, mesh services]</text>
<text class="t-desc" x="76" y="530">Any mesh service with mcl-om's</text>
<text class="t-desc" x="76" y="546">inbound guard publishes</text>
<text class="t-desc" x="76" y="562">denials_observed per active window</text>
<rect class="b-mac" x="400" y="460" width="300" height="136" rx="10"/>
<text class="t-name" x="416" y="488">macula-realm</text>
<text class="t-type" x="416" y="506">[Macula infrastructure]</text>
<text class="t-desc" x="416" y="530">Endorses the node's identity key</text>
<text class="t-desc" x="416" y="546">and grants a provider authorization</text>
<text class="t-desc" x="416" y="562">for each org procedure it advertises,</text>
<text class="t-desc" x="416" y="578">info and get_limits included</text>
<rect class="b-mac" x="770" y="460" width="270" height="120" rx="10"/>
<text class="t-name" x="786" y="488">Macula stations, mesh DHT</text>
<text class="t-type" x="786" y="506">[Macula infrastructure]</text>
<text class="t-desc" x="786" y="530">The pinned stations are its mesh</text>
<text class="t-desc" x="786" y="546">entry points over QUIC; the DHT</text>
<text class="t-desc" x="786" y="562">holds mcl_om's info and get_limits</text>
<path class="edge" d="M200 150V190H440V220" marker-end="url(#a)"/>
<text class="t-rel" x="208" y="168">opens the console</text>
<path class="edge" d="M905 134V200H660V220" marker-end="url(#a)"/>
<text class="t-rel" x="664" y="164">deploys the release, sets the env</text>
<path class="edge" d="M550 220V140" marker-end="url(#a)"/>
<text class="t-rel" x="558" y="178">writes proposals.log and run sets</text>
<path class="edge" d="M200 460V420H440V370" marker-end="url(#a)"/>
<text class="t-rel" x="208" y="400">publishes denials_observed</text>
<text class="t-rel" x="208" y="416">once per active window</text>
<path class="edge" d="M500 370V460" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="412">claims scope mcl-sec-guard</text>
<path class="edge" d="M700 330H740V430H905V460" marker-end="url(#a)"/>
<text class="t-rel" x="748" y="348">joins the mesh through the</text>
<text class="t-rel" x="748" y="364">pinned stations (QUIC)</text>
<text class="t-desc" x="60" y="650">P0 shadow: the guardian applies nothing. No set_limits call is in its namespace, and capabilities/0 declares</text>
<text class="t-desc" x="60" y="668">nothing of its own: mcl_om adds the info and get_limits every service carries. The console is an audit</text>
<text class="t-desc" x="60" y="686">window: it renders the log and the run sets, and its run button writes a run set. It decides nothing.</text>
<rect class="b-sys" x="24" y="730" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="742">In scope</text>
<rect class="b-per" x="110.8" y="730" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="742">Person</text>
<rect class="b-mac" x="184.39999999999998" y="730" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="742">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="730" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="742">External system</text>
<rect class="b-cmp" x="490.0" y="730" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="742">Container or component</text>
</svg>
